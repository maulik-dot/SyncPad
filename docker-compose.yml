services:
  postgres:
    image: postgres:16-alpine
    container_name: syncpad_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syncpad_db}
      POSTGRES_USER: ${POSTGRES_USER:-syncpad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syncpad_user} -d ${POSTGRES_DB:-syncpad_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          memory: 128M

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: syncpad_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-syncpad}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-syncpad_stomp_pass_99x}
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp && exec rabbitmq-server"
    expose:
      - "5672"
      - "61613"
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M
        reservations:
          memory: 128M

  app:
    image: syncpad:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncpad_app
    ports:
      - "127.0.0.1:${APP_PORT:-8083}:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-syncpad_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-syncpad_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://localhost,http://localhost:3000,http://localhost:5173,http://localhost:8082,http://localhost:8083}
      SPRING_WEBSOCKET_RELAY_ENABLED: ${SPRING_WEBSOCKET_RELAY_ENABLED:-true}
      SPRING_WEBSOCKET_RELAY_HOST: rabbitmq
      SPRING_WEBSOCKET_RELAY_PORT: 61613
      SPRING_WEBSOCKET_RELAY_CLIENT_LOGIN: ${RABBITMQ_USER:-syncpad}
      SPRING_WEBSOCKET_RELAY_CLIENT_PASSCODE: ${RABBITMQ_PASSWORD:-syncpad_stomp_pass_99x}
      SPRING_WEBSOCKET_RELAY_SYSTEM_LOGIN: ${RABBITMQ_USER:-syncpad}
      SPRING_WEBSOCKET_RELAY_SYSTEM_PASSCODE: ${RABBITMQ_PASSWORD:-syncpad_stomp_pass_99x}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: syncpad_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    depends_on:
      - app

volumes:
  postgres_data:
