                <div id="starredView" class="hidden" style="flex: 1; overflow-y: auto; padding: 2rem;">
                    <!-- HEADER -->
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                        <div>
                            <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.25rem;">
                                <div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(245, 158, 11, 0.1); color: #f59e0b; display: flex; align-items: center; justify-content: center;">
                                    <i data-lucide="star" style="width: 22px; height: 22px; fill: #f59e0b;"></i>
                                </div>
                                <div>
                                    <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary); margin: 0; line-height: 1.2;">
                                        Starred Documents
                                    </h1>
                                    <p style="font-size: 0.85rem; color: var(--text-secondary); margin: 0.2rem 0 0;">
                                        Quick access to your pinned and favorite files across all workspaces
                                    </p>
                                </div>
                            </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 0.6rem;">
                            <span id="starredTotalBadge" class="badge badge-role" style="font-size: 0.8rem; padding: 0.35rem 0.75rem; background: rgba(245, 158, 11, 0.1); color: #d97706; border: 1px solid rgba(245, 158, 11, 0.2);">
                                0 items
                            </span>
                        </div>
                    </div>

                    <!-- SEARCH & FILTER CONTROLS BAR -->
                    <div class="card" style="padding: 0.85rem 1.25rem; margin-bottom: 1.5rem; display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between;">
                        <div style="display: flex; align-items: center; gap: 0.5rem; flex: 1; min-width: 260px;">
                            <div style="position: relative; flex: 1;">
                                <i data-lucide="search" style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text-muted);"></i>
                                <input type="text" id="starredSearchInput" class="input" placeholder="Search starred files or #tags..." oninput="handleStarredSearch(this.value)" style="padding-left: 2.2rem; font-size: 0.82rem; height: 36px; width: 100%;">
                            </div>
                        </div>

                        <!-- TYPE TABS -->
                        <div style="display: flex; gap: 0.35rem; background: var(--bg-surface-sunken); padding: 0.25rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
                            <button id="starredTabAll" onclick="setStarredFilter('all')" class="tab-item active" style="font-size: 0.8rem; padding: 0.3rem 0.75rem; border-radius: 4px;">
                                All (<span id="starredCountAll">0</span>)
                            </button>
                            <button id="starredTabDoc" onclick="setStarredFilter('DOC')" class="tab-item" style="font-size: 0.8rem; padding: 0.3rem 0.75rem; border-radius: 4px;">
                                Docs (<span id="starredCountDoc">0</span>)
                            </button>
                            <button id="starredTabBoard" onclick="setStarredFilter('WHITEBOARD')" class="tab-item" style="font-size: 0.8rem; padding: 0.3rem 0.75rem; border-radius: 4px;">
                                Boards (<span id="starredCountBoard">0</span>)
                            </button>
                        </div>
                    </div>

                    <!-- STARRED GRID -->
                    <div id="starredDocumentsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem;">
                        <!-- Rendered dynamically -->
                    </div>
                </div>
