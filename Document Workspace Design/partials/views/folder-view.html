                <div id="folderView" class="hidden" style="flex: 1; overflow-y: auto; padding: 2rem;">
                    
                    <!-- FOLDER HERO BANNER -->
                    <div class="folder-hero-banner">
                        
                        <!-- BREADCRUMBS -->
                        <div style="display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 1.25rem;">
                            <button class="btn btn-icon" onclick="closeFolderView()" title="Back" aria-label="Back" style="width:28px;height:28px;padding:0;">
                                <i data-lucide="arrow-left" style="width:16px;height:16px;"></i>
                            </button>
                            <a href="#" onclick="showHomeView(document.getElementById('navHomeItem'))" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">Home</a>
                            <i data-lucide="chevron-right" style="width:14px;height:14px;color:var(--text-muted);"></i>
                            <a href="#" onclick="showWorkspaceDashboardView(document.getElementById('navDashboardItem'))" id="folderWorkspaceBreadcrumb" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">Workspace</a>
                            <i data-lucide="chevron-right" style="width:14px;height:14px;color:var(--text-muted);"></i>
                            <span id="folderNameBreadcrumb" style="color: var(--accent-primary); font-weight: 600;">Folder</span>
                        </div>

                        <!-- FOLDER TITLE & PRIMARY ACTION BAR -->
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1.25rem;">
                            <div style="display: flex; align-items: flex-start; gap: 1rem;">
                                <div class="folder-badge-avatar">
                                    <i data-lucide="folder" style="width:24px;height:24px;"></i>
                                </div>
                                <div>
                                    <div style="display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.4rem;">
                                        <h1 id="activeFolderName" style="font-size: 1.65rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2;">Active Folder</h1>
                                        <button class="btn btn-icon" onclick="openRenameModal('folder', activeFolder.id, activeFolder.name)" title="Rename Folder" aria-label="Rename Folder">
                                            <i data-lucide="edit-2" style="width:15px;height:15px;"></i>
                                        </button>
                                        <button class="btn btn-icon btn-icon-danger" onclick="deleteActiveFolder()" title="Delete Folder" aria-label="Delete Folder">
                                            <i data-lucide="trash-2" style="width:15px;height:15px;"></i>
                                        </button>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                                        <span class="badge badge-role" style="font-size: 0.72rem; display: flex; align-items: center; gap: 0.25rem;">
                                            <i data-lucide="layout-grid" style="width:11px;height:11px;"></i>
                                            <span id="folderWorkspaceBadge">Workspace</span>
                                        </span>
                                        <span id="folderItemCountBadge" class="folder-stat-pill">
                                            <i data-lucide="files" style="width:12px;height:12px;"></i> 0 items
                                        </span>
                                        <span id="folderDocCountBadge" class="folder-stat-pill" style="color:var(--accent-primary);">
                                            <i data-lucide="file-text" style="width:12px;height:12px;"></i> 0 Docs
                                        </span>
                                        <span id="folderBoardCountBadge" class="folder-stat-pill" style="color:#9333ea;">
                                            <i data-lucide="presentation" style="width:12px;height:12px;"></i> 0 Boards
                                        </span>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- ACTION BUTTONS: ADD DOC & ADD WHITEBOARD & PERMISSIONS -->
                            <div style="display: flex; align-items: center; gap: 0.65rem;">
                                <button class="btn btn-outline" onclick="openFolderAccessModal(activeFolder.id, activeFolder.name)" style="font-weight:600; padding: 0.55rem 0.85rem;" title="Folder Permissions & Restrictions">
                                    <i data-lucide="shield" style="width:15px;height:15px;color:var(--accent-primary);"></i>
                                    <span>Permissions</span>
                                </button>
                                <button class="btn btn-primary" onclick="openCreateInFolderModal('DOC')" style="font-weight:600; padding: 0.55rem 1rem;">
                                    <i data-lucide="file-plus" style="width:16px;height:16px;"></i>
                                    <span>Add Doc</span>
                                </button>
                                <button class="btn btn-outline" onclick="openCreateInFolderModal('WHITEBOARD')" style="font-weight:600; padding: 0.55rem 1rem; border-color: rgba(147, 51, 234, 0.3); color: #9333ea; background: var(--bg-surface);">
                                    <i data-lucide="presentation" style="width:16px;height:16px;color:#9333ea;"></i>
                                    <span>Add Whiteboard</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- FOLDER TOOLBAR (TABS + IN-FOLDER SEARCH + VIEW SWITCHER) -->
                    <div class="folder-toolbar-container">
                        <div class="tabs">
                            <button class="tab-item active" onclick="switchFolderFilterTab('all', this)">
                                <i data-lucide="layers"></i>
                                <span>All Files</span>
                            </button>
                            <button class="tab-item" onclick="switchFolderFilterTab('DOC', this)">
                                <i data-lucide="file-text"></i>
                                <span>Documents</span>
                            </button>
                            <button class="tab-item" onclick="switchFolderFilterTab('WHITEBOARD', this)">
                                <i data-lucide="presentation"></i>
                                <span>Whiteboards</span>
                            </button>
                        </div>

                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <!-- IN-FOLDER SEARCH -->
                            <div class="folder-search-input-box">
                                <i data-lucide="search"></i>
                                <input type="text" id="folderSearchInput" placeholder="Search in folder..." oninput="handleFolderSearch(this.value)">
                            </div>
                            
                            <!-- VIEW TOGGLE (GRID VS LIST) -->
                            <div class="folder-view-toggle">
                                <button class="btn-icon active" id="folderGridViewBtn" onclick="toggleFolderViewMode('grid')" title="Grid View">
                                    <i data-lucide="layout-grid"></i>
                                </button>
                                <button class="btn-icon" id="folderListViewBtn" onclick="toggleFolderViewMode('list')" title="List View">
                                    <i data-lucide="list"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- FOLDER FILES GRID CONTAINER -->
                    <div id="folderFilesGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.15rem;">
                        <!-- Files rendered dynamically -->
                    </div>

                    <!-- FOLDER FILES LIST CONTAINER (HIDDEN BY DEFAULT) -->
                    <div id="folderFilesList" class="hidden">
                        <!-- List rows rendered dynamically -->
                    </div>

                </div>
