                <div id="dashboardView" class="hidden" style="flex: 1; overflow-y: auto; padding: 2rem;">
                    
                    <!-- WORKSPACE HEADER & ACTIONS -->
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1.25rem;">
                        <div>
                            <div style="display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.25rem;">
                                <h1 id="activeWorkspaceTitle" style="font-size: 1.6rem; font-weight: 700;">Personal Workspace</h1>
                                <span id="activeWorkspaceRoleBadge" class="notif-badge-pill role" style="font-size: 0.72rem; font-weight: 600;">Admin</span>
                                <button id="activeWsRenameBtn" class="btn btn-icon" onclick="openRenameModal('workspace', activeWorkspace.id, activeWorkspace.name)" title="Rename Workspace" aria-label="Rename Workspace">
                                    <i data-lucide="edit-2" style="width:16px;height:16px;"></i>
                                </button>
                                <button id="activeWsDeleteBtn" class="btn btn-icon btn-icon-danger" onclick="deleteActiveWorkspace()" title="Delete Workspace" aria-label="Delete Workspace">
                                    <i data-lucide="trash-2" style="width:16px;height:16px;"></i>
                                </button>
                                <button id="activeWsLeaveBtn" class="btn btn-outline" onclick="leaveActiveWorkspace()" title="Leave Workspace" style="font-size:0.75rem; padding:0.25rem 0.65rem; color:var(--danger); border-color:var(--border-color); display:none; align-items:center; gap:0.35rem;">
                                    <i data-lucide="log-out" style="width:13px;height:13px;"></i>
                                    <span>Leave Workspace</span>
                                </button>
                            </div>
                            <p id="activeWorkspaceDesc" style="font-size: 0.85rem; color: var(--text-secondary);">Collaborative environment for documents, whiteboards and team notes.</p>
                        </div>
                        
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <!-- WORKSPACE MEMBERS AVATARS -->
                            <div class="avatar-group" id="wsMembersAvatarGroup">
                                <div class="avatar" style="background:#2563eb;" title="Alex (Owner)">A</div>
                            </div>
                            <button class="btn btn-outline" onclick="openWorkspaceShareModal()" title="Share Workspace" aria-label="Share Workspace">
                                <i data-lucide="user-plus" style="width:16px;height:16px;"></i>
                                <span>Collaborate</span>
                            </button>
                            <button class="btn btn-primary" onclick="openCreateModal()">
                                <i data-lucide="plus" style="width:16px;height:16px;"></i>
                                <span>New Item</span>
                            </button>
                        </div>
                    </div>

                    <!-- FOLDERS SECTION -->
                    <div style="margin-bottom: 2.5rem;">
                        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                            <h2 style="font-size: 1.15rem; font-weight: 600;">Folders</h2>
                            <button class="btn btn-outline" onclick="openCreateFolderModal()" style="font-size: 0.8rem; padding: 0.35rem 0.75rem;">
                                <i data-lucide="folder-plus" style="width:15px;height:15px;"></i>
                                <span>Add Folder</span>
                            </button>
                        </div>
                        <div id="foldersGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem;">
                            <!-- Folders rendered dynamically -->
                        </div>
                    </div>

                    <!-- DOCUMENTS SECTION -->
                    <div style="margin-bottom: 2.5rem;">
                        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                            <h2 style="font-size: 1.15rem; font-weight: 600;">Documents</h2>
                            <a href="#" onclick="switchDashboardTab('docs', null)" style="font-size: 0.82rem; color: var(--accent-primary); text-decoration: none; font-weight: 600;">View all</a>
                        </div>
                        <div id="docsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem;">
                            <!-- Document cards rendered dynamically -->
                        </div>
                    </div>

                    <!-- WHITEBOARDS SECTION -->
                    <div style="margin-bottom: 2.5rem;">
                        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
                            <h2 style="font-size: 1.15rem; font-weight: 600;">Whiteboards</h2>
                            <a href="#" onclick="switchDashboardTab('whiteboards', null)" style="font-size: 0.82rem; color: var(--accent-primary); text-decoration: none; font-weight: 600;">View all</a>
                        </div>
                        <div id="whiteboardsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem;">
                            <!-- Whiteboard cards rendered dynamically -->
                        </div>
                    </div>

                </div>
