                <header style="height: 56px; border-bottom: 1px solid var(--border-color); background: var(--bg-surface); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem;">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <button class="btn btn-icon" id="mobileMenuBtn" onclick="toggleMobileSidebar()" title="Toggle Sidebar" aria-label="Toggle Sidebar" style="display: none;">
                            <i data-lucide="menu" style="width:20px;height:20px;"></i>
                        </button>
                        <div class="input-group" style="margin: 0; width: 320px;">
                            <div style="position: relative; display: flex; align-items: center;">
                                <i data-lucide="search" style="position: absolute; left: 0.75rem; width: 16px; height: 16px; color: var(--text-muted);"></i>
                                <input type="text" class="input" placeholder="Search workspace files & folders... (⌘K)" onclick="openGlobalSearch()" style="padding-left: 2.25rem; font-size: 0.82rem; height: 36px; background: var(--bg-app); cursor: pointer;" readonly>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <!-- NOTIFICATIONS DROPDOWN CONTAINER -->
                        <div style="position: relative;">
                            <button class="btn btn-icon" onclick="toggleNotificationsMenu()" title="Notifications" aria-label="Notifications" style="position: relative;">
                                <i data-lucide="bell" style="width:18px;height:18px;"></i>
                                <span id="notifBadge" class="header-notif-badge" style="display: none;">0</span>
                            </button>

                            <!-- NOTIFICATIONS DROPDOWN MENU -->
                            <div id="notificationsMenu" class="card hidden" style="position: absolute; top: 125%; right: 0; width: 370px; z-index: 999; padding: 0; box-shadow: var(--shadow-xl); border: 1px solid var(--border-color); background: var(--bg-surface); border-radius: var(--radius-md); overflow: hidden;">
                                <div style="display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1rem; border-bottom: 1px solid var(--border-color); background: var(--bg-surface-hover);">
                                    <div style="font-weight: 600; font-size: 0.88rem; display: flex; align-items: center; gap: 0.45rem;">
                                        <i data-lucide="bell" style="width:16px;height:16px;color:var(--primary);"></i>
                                        <span>Notifications</span>
                                        <span id="notifCountPill" class="notif-badge-pill role" style="font-size:0.68rem; display:none;">0</span>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 0.35rem;">
                                        <button onclick="markNotificationsAsRead()" class="btn btn-outline" style="font-size: 0.7rem; padding: 0.2rem 0.5rem;" title="Mark all as read">Mark read</button>
                                        <button onclick="clearAllNotifications()" class="btn btn-outline" style="font-size: 0.7rem; padding: 0.2rem 0.5rem; color: var(--text-muted);" title="Clear all notifications"><i data-lucide="trash-2" style="width:12px;height:12px;"></i> Clear</button>
                                    </div>
                                </div>
                                <div id="notificationsList" style="display: flex; flex-direction: column; max-height: 320px; overflow-y: auto;">
                                    <!-- Populated dynamically by renderNotifications() -->
                                </div>
                            </div>
                        </div>

                        <button class="btn btn-icon" onclick="toggleTheme()" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
                            <i data-lucide="sun" id="themeIcon" style="width:18px;height:18px;"></i>
                        </button>
                        <div class="toolbar-divider"></div>
                        <div id="headerUserAvatar" class="avatar" style="cursor: pointer;" onclick="openSettingsView()">U</div>
                    </div>
                </header>
