server.port=${PORT:${SERVER_PORT:8082}}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# JPA/Hibernate Configuration (Validated against Flyway migrations in production)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Flyway Database Migrations
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Jwt Service (Externalized to HashiCorp Vault / Cloud Secret Manager / Environment)
jwt.secret=${JWT_SECRET:0dac6e9cb86c30ad6aabb1010399e5c176496eac40a44705e86fd33f8186bdf3}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google OAuth Configuration — must be a valid OAuth 2.0 Client ID ending with .apps.googleusercontent.com
# No hardcoded fallback: if unset, Google Sign-In is disabled and /auth/google returns 401
google.client-id=${GOOGLE_CLIENT_ID:}

# Google Gemini AI Integration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-lite-latest}

# Allowed Origins for CORS and WebSockets (comma-separated)
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://syncpad.yourdomain.com,https://localhost,http://localhost,http://localhost:3000,http://localhost:5173,http://localhost:8082,http://localhost:8083,http://localhost:8443,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:8082,http://127.0.0.1:8083,http://127.0.0.1:8443}

# Actuator Health, Readiness, and Prometheus Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.export.prometheus.enabled=true

# HikariCP Tuning — prevents pool exhaustion (home page not loading)
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.connectionTimeout=10000
spring.datasource.hikari.leakDetectionThreshold=60000
spring.datasource.hikari.idleTimeout=300000

# High-Throughput Rate Limiting (Configurable for Load Testing & Production)
syncpad.ratelimit.ws-limit=${SYNCPAD_RATELIMIT_WS_LIMIT:10000}
syncpad.ratelimit.login-limit=${SYNCPAD_RATELIMIT_LOGIN_LIMIT:500}
syncpad.ratelimit.register-limit=${SYNCPAD_RATELIMIT_REGISTER_LIMIT:500}

# Enterprise SCIM Provisioning Bearer Token
app.scim.token=${SCIM_BEARER_TOKEN:}

# Enterprise SSO Configuration (Disabled by default; simulation-mode must be explicitly enabled)
app.sso.enabled=${SSO_ENABLED:false}
app.sso.simulation-mode=${SSO_SIMULATION_MODE:false}

# Externalized Secret Management Initializer (Vault, AWS Secrets Manager, GCP Secret Manager)
context.initializer.classes=com.example.syncpad.security.secrets.SecretApplicationContextInitializer

