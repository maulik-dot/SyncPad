                <div id="notificationsView" class="hidden" style="flex: 1; overflow-y: auto; padding: 2rem;">
                    
                    <!-- HEADER -->
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1.25rem;">
                        <div>
                            <div style="display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.25rem;">
                                <div style="width: 36px; height: 36px; border-radius: var(--radius-sm); background: rgba(37, 99, 235, 0.1); display: flex; align-items: center; justify-content: center; color: var(--primary);">
                                    <i data-lucide="bell" style="width:20px;height:20px;"></i>
                                </div>
                                <h1 style="font-size: 1.6rem; font-weight: 700;">Notifications & Activity</h1>
                                <span id="fullNotifUnreadPill" class="notif-badge-pill role" style="font-size: 0.72rem;">0 unread</span>
                            </div>
                            <p style="font-size: 0.85rem; color: var(--text-secondary);">Manage invitations, workspace collaboration requests, and activity alerts.</p>
                        </div>
                        
                        <div style="display: flex; align-items: center; gap: 0.6rem;">
                            <button class="btn btn-outline" onclick="markNotificationsAsRead()" style="font-size: 0.82rem; padding: 0.45rem 0.85rem;">
                                <i data-lucide="check-check" style="width:15px;height:15px;"></i>
                                <span>Mark all as read</span>
                            </button>
                            <button class="btn btn-outline" onclick="clearAllNotifications()" style="font-size: 0.82rem; padding: 0.45rem 0.85rem; color: var(--text-secondary);">
                                <i data-lucide="trash-2" style="width:15px;height:15px;"></i>
                                <span>Clear all</span>
                            </button>
                            <button class="btn btn-outline" onclick="loadNotifications()" title="Refresh" aria-label="Refresh" style="padding: 0.45rem 0.65rem;">
                                <i data-lucide="refresh-cw" style="width:15px;height:15px;"></i>
                            </button>
                        </div>
                    </div>

                    <!-- FILTER TABS & SEARCH -->
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                        <div class="tabs">
                            <button class="tab-item active" onclick="filterFullNotifications('all', this)">
                                <i data-lucide="layers"></i>
                                <span>All</span>
                                <span id="tabCountAll" style="font-size:0.75rem; opacity:0.8; font-weight:500;">(0)</span>
                            </button>
                            <button class="tab-item" onclick="filterFullNotifications('invites', this)">
                                <i data-lucide="mail"></i>
                                <span>Invites</span>
                                <span id="tabCountInvites" style="font-size:0.75rem; opacity:0.8; font-weight:500;">(0)</span>
                            </button>
                            <button class="tab-item" onclick="filterFullNotifications('unread', this)">
                                <i data-lucide="bell"></i>
                                <span>Unread</span>
                                <span id="tabCountUnread" style="font-size:0.75rem; opacity:0.8; font-weight:500;">(0)</span>
                            </button>
                        </div>

                        <div style="position: relative; width: 260px;">
                            <i data-lucide="search" style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-muted);"></i>
                            <input type="text" id="notifSearchInput" oninput="renderFullNotificationsList()" class="input" placeholder="Filter notifications..." style="padding-left: 2.2rem; font-size: 0.8rem; height: 34px;">
                        </div>
                    </div>

                    <!-- NOTIFICATIONS FULL LIST CONTAINER -->
                    <div id="fullNotificationsList" style="display: flex; flex-direction: column; gap: 0.75rem;">
                        <!-- Dynamically rendered -->
                    </div>

                </div>
