name: SyncPad CI / CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: Backend Unit & Integration Tests (83 Tests)
  # =========================================================================
  backend-test:
    name: Backend Unit & Integration Tests (83 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Run Full Maven Test Suite (83 Tests)
        run: ./mvnw clean test

      - name: Upload Surefire Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  # =========================================================================
  # JOB 2: Frontend Asset Compilation & Linting
  # =========================================================================
  frontend-build:
    name: Frontend Build & Asset Compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Document Workspace Design"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Frontend Assets
        run: pnpm build

  # =========================================================================
  # JOB 3: Container Security Vulnerability Scanning (Trivy)
  # =========================================================================
  security-scan:
    name: Container Security Scanning (Trivy)
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Application Docker Image
        run: docker build -t syncpad:latest .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'syncpad:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # =========================================================================
  # JOB 4: Headless Docker Stack & Live E2E Verification (121 Assertions)
  # =========================================================================
  docker-compose-e2e:
    name: Docker Stack Build & E2E Verification (121 Assertions)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup CI Environment Variables
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_TO_STRONG_PASSWORD_MIN_24_CHARS/ci_test_password_syncpad_2026/g' .env
          sed -i 's/GENERATE_FRESH_SECRET_WITH_OPENSSL_RAND_HEX_32/0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef/g' .env
          sed -i 's/CHANGE_ME_TO_RABBITMQ_STRONG_PASSWORD/ci_test_stomp_pass_99x/g' .env
          sed -i 's/CHANGE_ME_TO_ENCRYPTION_PASSPHRASE/ci_test_backup_pass_enc_77/g' .env
          echo "SYNCPAD_RATELIMIT_LOGIN_LIMIT=500" >> .env
          echo "SYNCPAD_RATELIMIT_REGISTER_LIMIT=500" >> .env
          echo "SYNCPAD_RATELIMIT_WS_LIMIT=10000" >> .env

      - name: Generate Ephemeral Self-Signed TLS Certificates
        run: |
          mkdir -p nginx/ssl
          openssl req -x509 -nodes -days 30 -newkey rsa:2048 \
            -keyout nginx/ssl/key.pem \
            -out nginx/ssl/cert.pem \
            -subj "/CN=localhost"

      - name: Build Docker Stack
        run: docker compose build --no-cache

      - name: Start Docker Stack
        run: docker compose up -d

      - name: Initialize HashiCorp Vault Secrets
        run: |
          chmod +x scripts/vault-init.sh
          ./scripts/vault-init.sh || echo "Vault initialized"

      - name: Wait for Stack Services to be Healthy
        run: |
          echo "Waiting for services to become healthy..."
          for i in {1..60}; do
            if curl -k -s https://localhost/actuator/health | grep -q '"status":"UP"'; then
              echo "==> SyncPad cluster is healthy and serving HTTPS!"
              break
            fi
            echo "Waiting for backend health probe... ($i/60)"
            sleep 2
          done

      - name: Run Production Deployment Verifications
        run: |
          chmod +x scripts/verify_deployment.sh
          ./scripts/verify_deployment.sh

      - name: Run Live E2E Test Suite (121 Assertions across 16 Scenarios)
        run: |
          chmod +x scripts/run_e2e_tests.sh
          ./scripts/run_e2e_tests.sh

      - name: Capture Container Logs on Failure
        if: failure()
        run: docker compose logs --tail 200 > docker-compose-failure.log

      - name: Upload Docker Logs Artifact on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose-failure.log

      - name: Tear Down Stack
        if: always()
        run: docker compose down -v

  # =========================================================================
  # JOB 5: Performance Regression Gate (k6 Load Benchmark)
  # =========================================================================
  k6-performance-gate:
    name: Performance Regression Gate (k6 Load Benchmark)
    runs-on: ubuntu-latest
    needs: [docker-compose-e2e]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup CI Environment Variables
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_TO_STRONG_PASSWORD_MIN_24_CHARS/ci_test_password_syncpad_2026/g' .env
          sed -i 's/GENERATE_FRESH_SECRET_WITH_OPENSSL_RAND_HEX_32/0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef/g' .env
          sed -i 's/CHANGE_ME_TO_RABBITMQ_STRONG_PASSWORD/ci_test_stomp_pass_99x/g' .env
          sed -i 's/CHANGE_ME_TO_ENCRYPTION_PASSPHRASE/ci_test_backup_pass_enc_77/g' .env
          echo "SYNCPAD_RATELIMIT_LOGIN_LIMIT=500" >> .env
          echo "SYNCPAD_RATELIMIT_REGISTER_LIMIT=500" >> .env
          echo "SYNCPAD_RATELIMIT_WS_LIMIT=10000" >> .env

      - name: Generate Ephemeral Self-Signed TLS Certificates
        run: |
          mkdir -p nginx/ssl
          openssl req -x509 -nodes -days 30 -newkey rsa:2048 \
            -keyout nginx/ssl/key.pem \
            -out nginx/ssl/cert.pem \
            -subj "/CN=localhost"

      - name: Start Compose Stack
        run: |
          docker compose build --no-cache
          docker compose up -d

      - name: Initialize HashiCorp Vault Secrets
        run: |
          chmod +x scripts/vault-init.sh
          ./scripts/vault-init.sh || echo "Vault initialized"

      - name: Wait for Stack Services to be Healthy
        run: |
          for i in {1..60}; do
            if curl -k -s https://localhost/actuator/health | grep -q '"status":"UP"'; then
              echo "==> Cluster is ready for load testing!"
              break
            fi
            sleep 2
          done

      - name: Run k6 Load Benchmark & Enforce SLO Regression Gate
        run: |
          chmod +x scripts/run-load-test.sh
          ./scripts/run-load-test.sh

      - name: Tear Down Stack
        if: always()
        run: docker compose down -v
