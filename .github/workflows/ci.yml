name: SyncPad CI / CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-build:
    name: Frontend Build & Asset Compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Document Workspace Design"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Frontend Assets
        run: pnpm build

  backend-test:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Run Maven Tests
        run: ./mvnw clean test

  docker-compose-e2e:
    name: Docker Stack Build & E2E Verification
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Test Environment Variables
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_TO_STRONG_PASSWORD_MIN_24_CHARS/ci_test_password_syncpad_2026/g' .env
          sed -i 's/GENERATE_FRESH_SECRET_WITH_OPENSSL_RAND_HEX_32/0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef/g' .env
          sed -i 's/CHANGE_ME_TO_RABBITMQ_STRONG_PASSWORD/ci_test_stomp_pass_99x/g' .env
          sed -i 's/CHANGE_ME_TO_ENCRYPTION_PASSPHRASE/ci_test_backup_pass_enc_77/g' .env

      - name: Generate Ephemeral Self-Signed TLS Certificates
        run: |
          mkdir -p nginx/ssl
          openssl req -x509 -nodes -days 30 -newkey rsa:2048 \
            -keyout nginx/ssl/key.pem \
            -out nginx/ssl/cert.pem \
            -subj "/CN=localhost"

      - name: Build Docker Compose Images
        run: docker compose build --no-cache

      - name: Start Compose Stack
        run: docker compose up -d

      - name: Wait for Containers to be Healthy
        run: |
          for i in {1..30}; do
            if docker inspect --format='{{.State.Health.Status}}' syncpad_postgres 2>/dev/null | grep -q 'healthy' && \
               docker inspect --format='{{.State.Health.Status}}' syncpad_rabbitmq 2>/dev/null | grep -q 'healthy'; then
              echo "Containers are healthy!"
              break
            fi
            echo "Waiting for services... ($i/30)"
            sleep 2
          done

      - name: Verify Live Deployment Health & Security
        run: |
          chmod +x scripts/verify_deployment.sh
          ./scripts/verify_deployment.sh

      - name: Run Full Browser & API End-to-End Suite
        run: |
          chmod +x scripts/run_e2e_tests.sh
          ./scripts/run_e2e_tests.sh

      - name: Tear Down Stack
        if: always()
        run: docker compose down -v
