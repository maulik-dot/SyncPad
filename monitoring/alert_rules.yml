groups:
  - name: syncpad_alerts
    rules:
      - alert: SyncPadServiceDown
        expr: up{job="syncpad-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SyncPad instance down"
          description: "SyncPad application instance has been unreachable for more than 1 minute."

      - alert: HighHttp5xxRate
        expr: (sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m]))) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx Error Rate"
          description: "SyncPad HTTP 5xx error rate is currently {{ $value | printf \"%.2f\" }}% (> 5% threshold)."

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 1.0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High P95 HTTP Request Latency"
          description: "SyncPad 95th percentile response time is {{ $value | printf \"%.2f\" }}s (> 1.0s threshold)."

      - alert: HighJvmHeapUsage
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High JVM Heap Memory Usage"
          description: "JVM Heap usage is above 85% for more than 5 minutes (currently {{ $value | printf \"%.2f\" }}%)."

      - alert: DatabasePoolSaturation
        expr: (hikaricp_connections_active / hikaricp_connections_max) * 100 > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database Connection Pool Near Saturation"
          description: "HikariCP active connections exceed 90% of max pool capacity."
