global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "application", "environment"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default-receiver"
  routes:
    - match:
        severity: critical
      receiver: "critical-alerts"
      repeat_interval: 1h

receivers:
  - name: "default-receiver"
    webhook_configs:
      - url: "http://127.0.0.1:5001/webhook"
        send_resolved: true

  - name: "critical-alerts"
    webhook_configs:
      - url: "http://127.0.0.1:5001/critical-webhook"
        send_resolved: true
