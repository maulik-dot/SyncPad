apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "syncpad.fullname" . }}-config
  labels:
    {{- include "syncpad.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.env.SPRING_PROFILES_ACTIVE | quote }}
  SPRING_DATASOURCE_URL: {{ .Values.env.SPRING_DATASOURCE_URL | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.env.SPRING_DATASOURCE_USERNAME | quote }}
  SPRING_WEBSOCKET_RELAY_HOST: {{ .Values.env.SPRING_WEBSOCKET_RELAY_HOST | quote }}
  SPRING_WEBSOCKET_RELAY_PORT: {{ .Values.env.SPRING_WEBSOCKET_RELAY_PORT | quote }}
  SYNCPAD_RATELIMIT_LOGIN_LIMIT: {{ .Values.env.SYNCPAD_RATELIMIT_LOGIN_LIMIT | quote }}
  SYNCPAD_RATELIMIT_REGISTER_LIMIT: {{ .Values.env.SYNCPAD_RATELIMIT_REGISTER_LIMIT | quote }}
  SYNCPAD_RATELIMIT_WS_LIMIT: {{ .Values.env.SYNCPAD_RATELIMIT_WS_LIMIT | quote }}
  GEMINI_MODEL: {{ .Values.env.GEMINI_MODEL | quote }}
  JAVA_TOOL_OPTIONS: {{ .Values.env.JAVA_TOOL_OPTIONS | quote }}

