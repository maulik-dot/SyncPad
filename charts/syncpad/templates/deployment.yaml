apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "syncpad.fullname" . }}
  labels:
    {{- include "syncpad.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "syncpad.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and .Values.vault.enabled .Values.vault.agentInject }}
        vault.hashicorp.com/agent-inject: {{ .Values.vault.agentInject | quote }}
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-credentials: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-credentials: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" -}}`}}
          export SPRING_DATASOURCE_PASSWORD="{{`{{ .Data.data.POSTGRES_PASSWORD }}`}}"
          export JWT_SECRET="{{`{{ .Data.data.JWT_SECRET }}`}}"
          export RABBITMQ_PASSWORD="{{`{{ .Data.data.RABBITMQ_PASSWORD }}`}}"
          export SPRING_WEBSOCKET_RELAY_CLIENT_PASSCODE="{{`{{ .Data.data.RABBITMQ_PASSWORD }}`}}"
          export SPRING_WEBSOCKET_RELAY_SYSTEM_PASSCODE="{{`{{ .Data.data.RABBITMQ_PASSWORD }}`}}"
          {{`{{- end -}}`}}
        {{- end }}
      labels:
        {{- include "syncpad.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "syncpad.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if and .Values.vault.enabled .Values.vault.agentInject }}
          command:
            - "/bin/sh"
            - "-c"
            - |
              if [ -f /vault/secrets/credentials ]; then
                . /vault/secrets/credentials
              fi
              exec java $JAVA_TOOL_OPTIONS -jar /app/app.jar
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "syncpad.fullname" . }}-config
          env:
            {{- if not .Values.vault.enabled }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncpad.fullname" . }}-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncpad.fullname" . }}-secrets
                  key: JWT_SECRET
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncpad.fullname" . }}-secrets
                  key: RABBITMQ_PASSWORD
            - name: SPRING_WEBSOCKET_RELAY_CLIENT_PASSCODE
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncpad.fullname" . }}-secrets
                  key: RABBITMQ_PASSWORD
            - name: SPRING_WEBSOCKET_RELAY_SYSTEM_PASSCODE
              valueFrom:
                secretKeyRef:
                  name: {{ include "syncpad.fullname" . }}-secrets
                  key: RABBITMQ_PASSWORD
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

