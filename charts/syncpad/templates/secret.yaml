{{- if not .Values.vault.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "syncpad.fullname" . }}-secrets
  labels:
    {{- include "syncpad.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | quote }}
{{- end }}

