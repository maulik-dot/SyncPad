{{- if and .Values.certManager.enabled .Values.certManager.createClusterIssuer }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certManager.clusterIssuer }}
  labels:
    {{- include "syncpad.labels" . | nindent 4 }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.certManager.acmeEmail | quote }}
    privateKeySecretRef:
      name: {{ .Values.certManager.clusterIssuer }}-account-key
    solvers:
      - http01:
          ingress:
            class: {{ .Values.ingress.className | default "nginx" }}
{{- end }}

