apiVersion: batch/v1
kind: CronJob
metadata:
  name: syncpad-db-backup
  namespace: syncpad
  labels:
    app.kubernetes.io/name: syncpad-backup
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: syncpad-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: db-backup
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: syncpad-secrets
                      key: POSTGRES_PASSWORD
                - name: BACKUP_PASSPHRASE
                  valueFrom:
                    secretKeyRef:
                      name: syncpad-secrets
                      key: BACKUP_PASSPHRASE
              command:
                - "sh"
                - "-c"
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
                  BACKUP_DIR="/tmp/backups"
                  mkdir -p "${BACKUP_DIR}"
                  BACKUP_FILE="${BACKUP_DIR}/syncpad_backup_${TIMESTAMP}.sql.gz.enc"
                  CHECKSUM_FILE="${BACKUP_DIR}/syncpad_backup_${TIMESTAMP}.sha256"

                  echo "--> Starting automated database backup at $(date)..."
                  pg_dump -h syncpad-postgres -U syncpad_user -d syncpad_db --no-owner --clean --if-exists | \
                    gzip -c | \
                    openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -pass env:BACKUP_PASSPHRASE -out "${BACKUP_FILE}"

                  sha256sum "${BACKUP_FILE}" > "${CHECKSUM_FILE}"
                  echo "--> Encrypted backup created successfully: $(du -sh ${BACKUP_FILE})"
                  echo "--> SHA256 Checksum: $(cat ${CHECKSUM_FILE})"
                  # In production with cloud storage, offload via aws s3 cp or gsutil cp here
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
